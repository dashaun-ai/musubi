server:
  port: ${PORT:8080}

spring:
  application:
    name: musubi
  config:
    import: optional:configserver:${SASHIZU_URL:http://localhost:8888}
  cloud:
    openservicebroker:
      # The local CAPI release sends OSBAPI 2.15. SCOSB validates this header exactly.
      api-version: 2.15

musubi:
  broker:
    username: ${MUSUBI_BROKER_USERNAME:musubi}
    password: ${MUSUBI_BROKER_PASSWORD:musubi-dev-secret}
  services:
    postgresql:
      host: ${MUSUBI_POSTGRESQL_HOST:postgresql.kansei-services.svc.cluster.local}
      port: ${MUSUBI_POSTGRESQL_PORT:5432}
      database: ${MUSUBI_POSTGRESQL_DATABASE:kansei_events}
      username: ${MUSUBI_POSTGRESQL_USERNAME:kansei}
      password: ${MUSUBI_POSTGRESQL_PASSWORD:kansei}
    rabbitmq:
      host: ${MUSUBI_RABBITMQ_HOST:rabbitmq.kansei-services.svc.cluster.local}
      port: ${MUSUBI_RABBITMQ_PORT:5672}
      username: ${MUSUBI_RABBITMQ_USERNAME:kansei}
      password: ${MUSUBI_RABBITMQ_PASSWORD:kansei}
      virtual-host: /
    redis:
      host: ${MUSUBI_REDIS_HOST:redis.kansei-services.svc.cluster.local}
      port: ${MUSUBI_REDIS_PORT:6379}
    lgtm:
      host: ${MUSUBI_LGTM_HOST:lgtm.kansei-services.svc.cluster.local}
      otlp-http-port: ${MUSUBI_LGTM_OTLP_HTTP_PORT:4318}
      otlp-grpc-port: ${MUSUBI_LGTM_OTLP_GRPC_PORT:4317}
      grafana-url: ${MUSUBI_GRAFANA_URL:https://grafana.127-0-0-1.nip.io}
    garage:
      endpoint: ${MUSUBI_GARAGE_ENDPOINT:http://juice:3900}
      region: ${MUSUBI_GARAGE_REGION:garage}
      run-artifacts:
        name: ${MUSUBI_GARAGE_RUN_ARTIFACTS_BUCKET:kansei-run-artifacts}
        access-key-id: ${MUSUBI_GARAGE_RUN_ARTIFACTS_ACCESS_KEY:dev-run-artifacts}
        secret-access-key: ${MUSUBI_GARAGE_RUN_ARTIFACTS_SECRET_KEY:dev-run-artifacts-secret}
      work-artifacts:
        name: ${MUSUBI_GARAGE_WORK_ARTIFACTS_BUCKET:kansei-work-artifacts}
        access-key-id: ${MUSUBI_GARAGE_WORK_ARTIFACTS_ACCESS_KEY:dev-work-artifacts}
        secret-access-key: ${MUSUBI_GARAGE_WORK_ARTIFACTS_SECRET_KEY:dev-work-artifacts-secret}
      browser-evidence:
        name: ${MUSUBI_GARAGE_BROWSER_EVIDENCE_BUCKET:kansei-browser-evidence}
        access-key-id: ${MUSUBI_GARAGE_BROWSER_EVIDENCE_ACCESS_KEY:dev-browser-evidence}
        secret-access-key: ${MUSUBI_GARAGE_BROWSER_EVIDENCE_SECRET_KEY:dev-browser-evidence-secret}
      encrypted-backups:
        name: ${MUSUBI_GARAGE_BACKUPS_BUCKET:kansei-encrypted-backups}
        access-key-id: ${MUSUBI_GARAGE_BACKUPS_ACCESS_KEY:dev-backups}
        secret-access-key: ${MUSUBI_GARAGE_BACKUPS_SECRET_KEY:dev-backups-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
